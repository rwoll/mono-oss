# mono-oss only changes through the export from the private monorepo, which
# runs the same checks before exporting. This confirms the mirror builds on its
# own, with its own lockfile.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
