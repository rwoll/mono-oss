# Publish every package whose version is not on npm yet, then tag it
# <folder>@<version> and create a GitHub release. See RELEASING.md.
#
# The publish credential never meets project or dependency code:
# - plan lists what to release, without installing anything.
# - build does a frozen install, compiles, and packs the tarballs.
# - test runs every check.
# - publish runs in the `npm` environment (main only) with
#   `id-token: write` for npm trusted publishing. It downloads the build job's
#   artifact by ID, checks each tarball's hash against the build job's output,
#   and runs only `npm stage publish`. Nothing is public until a maintainer
#   approves the staged version on npm with 2FA. npm adds provenance when this
#   repository is public, and stages without it while it is private.
# - tag creates the tags and releases after everything is staged, each with
#   its GitHub tarball (the npm tarball with @rwoll dependencies pointing at
#   release URLs, for machines that can't reach registry.npmjs.org), checked
#   against the build job's hashes. Releases are immutable once created.
# - backfill attaches those tarballs, made from the packages on npm, to earlier
#   releases that lack them. It runs no project code.
# No job restores a dependency cache.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - id: plan
        run: node scripts/publish-npm.ts plan

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      integrity: ${{ steps.pack.outputs.integrity }}
      github-artifact-id: ${{ steps.upload-github.outputs.artifact-id }}
      github-integrity: ${{ steps.pack.outputs.github-integrity }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack
        id: pack
        env:
          PLAN: ${{ needs.plan.outputs.releases }}
        run: node scripts/publish-npm.ts pack --out "$RUNNER_TEMP/npm-packages" --github-out "$RUNNER_TEMP/github-packages"

      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7.0.2
        id: upload-github
        with:
          name: github-packages
          path: ${{ runner.temp }}/github-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  test:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Pack the packages as npm would publish them and use them from a new project.
      - run: pnpm consumer-test --no-e2e

  publish:
    needs: [plan, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The publish script only; nothing is installed or built here.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/publish-npm.ts
            scripts/release-tarballs.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-packages
          merge-multiple: true

      - name: Stage on npm
        env:
          PLAN: ${{ needs.plan.outputs.releases }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: node scripts/publish-npm.ts publish --from "$RUNNER_TEMP/npm-packages"

  tag:
    needs: [plan, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.github-artifact-id }}
          path: ${{ runner.temp }}/github-packages
          merge-multiple: true

      - name: Tag and create releases
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.releases }}
          EXPECTED_GITHUB_INTEGRITY: ${{ needs.build.outputs.github-integrity }}
        run: node scripts/publish-npm.ts release --from "$RUNNER_TEMP/github-packages"

  backfill:
    needs: [plan, tag]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Attach tarballs to earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-npm.ts backfill
