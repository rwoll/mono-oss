# Publish the rwoll plugin marketplace (marketplace/) to the `stable` branch on
# every push to main, with the reusable workflow canvas-kit users call:
#   copilot plugin marketplace add rwoll/mono-oss#stable
# The `stable` environment allows only main. Pushes to main come only from the
# reviewed export, so there is no separate approval here.
name: Publish marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    # The build job drops this to read-only; only the push job writes.
    permissions:
      contents: write
    uses: ./.github/workflows/marketplace.yml
    with:
      working-directory: marketplace
      environment: stable
