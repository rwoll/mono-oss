<!doctype html>
<!-- The bakeoff logo: Blobby next to a winners' podium with a gold sparkle over first place. Blobby: microsoft/vscode, MIT (see ../LICENSE-blobby-sprites.txt). render.ts renders it. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
  .icon { position: absolute; inset: 16px; border-radius: 108px; overflow: hidden;
    background: radial-gradient(120% 120% at 25% 15%, #e39a62 0%, #b5642f 45%, #4f220d 100%); }
  /* Everything sits on Blobby's pixel grid: one sprite pixel is 8 px at 1x, 24 px here. */
  svg { position: absolute; inset: 0; width: 480px; height: 480px; shape-rendering: crispEdges; }
  img { position: absolute; image-rendering: pixelated; width: 288px; height: 288px; left: 24px; top: 168px; }
</style></head><body>
<div class="icon">
  <svg viewBox="0 0 480 480"><rect x="240" y="192" width="72" height="96" fill="#f6d9b0"/><rect x="240" y="192" width="72" height="24" fill="#fff1dc"/><rect x="312" y="144" width="72" height="144" fill="#ffffff"/><rect x="384" y="216" width="72" height="72" fill="#e9b77e"/><rect x="384" y="216" width="72" height="24" fill="#f6d2a4"/><rect x="336" y="48" width="24" height="72" fill="#ffd23f"/><rect x="312" y="72" width="72" height="24" fill="#ffd23f"/></svg>
  <img src="buddy-idle-insiders-96.png" alt="">
</div>
</body></html>
