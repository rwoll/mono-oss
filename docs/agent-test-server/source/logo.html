<!doctype html>
<!-- The agent-test-server logo: Blobby next to a server with status lights. Blobby: microsoft/vscode, MIT (see ../LICENSE-blobby-sprites.txt). render.ts renders it. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
  .icon { position: absolute; inset: 16px; border-radius: 108px; overflow: hidden;
    background: radial-gradient(120% 120% at 25% 15%, #c6e84a 0%, #6f9a12 45%, #263806 100%); }
  /* Everything sits on Blobby's pixel grid: one sprite pixel is 8 px at 1x, 24 px here. */
  svg { position: absolute; inset: 0; width: 480px; height: 480px; shape-rendering: crispEdges; }
  img { position: absolute; image-rendering: pixelated; width: 288px; height: 288px; left: 24px; top: 168px; }
</style></head><body>
<div class="icon">
  <svg id="server" viewBox="0 0 480 480"></svg>
  <img src="buddy-idle-insiders-96.png" alt="">
</div>
<script>
  // The server, one character per 24 px cell: E edge, B body, s slot, G and A status lights.
  const rows = [
    'EEEEEE',
    'EBBBBE',
    'EGBssE',
    'EBBBBE',
    'EGBssE',
    'EBBBBE',
    'EABssE',
    'EBBBBE',
    'EEEEEE',
    '.E..E.',
  ]
  const colors = { E: '#0e1620', B: '#3a4a5c', s: '#1a2430', G: '#5cf08f', A: '#ffc94d' }
  const svg = document.getElementById('server')
  rows.forEach((row, y) => [...row].forEach((cell, x) => {
    if (!colors[cell]) return
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
    Object.entries({ x: (13 + x) * 24, y: (9 + y) * 24, width: 24, height: 24, fill: colors[cell] }).forEach(([k, v]) => rect.setAttribute(k, v))
    svg.append(rect)
  }))
</script>
</body></html>
